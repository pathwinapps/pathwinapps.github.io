<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>CnX Receiver</title>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <style>
    :root {
      --bg:#16130F; --surface:#211C17; --surface2:#2B241D; --line2:#3A3129;
      --fg:#F4EEE7; --fg2:#D8CFC5; --fg3:#AFA498;
      --accent:#E8780E; --success:#3ec57a; --danger:#ff5a4d;
      --sans:Roboto,'Noto Sans','Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;
      --mono:'Roboto Mono','Noto Sans Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
    }
    html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; color:var(--fg);
      font-family:var(--sans); -webkit-font-smoothing:antialiased; }
    cast-media-player { position:absolute; inset:0; width:100%; height:100%; }

    .screen { position:absolute; inset:0; z-index:9990; background:var(--bg);
      display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
    .screen.hidden { display:none; }
    .title { font-weight:600; color:var(--fg); margin-top:3.2vmin; font-size:4.4vmin; letter-spacing:.2px; }

    #stage { position:absolute; inset:0; z-index:9989; background:var(--bg); }
    #stage.hidden { display:none; }
    #lockup { position:absolute; left:6.25vw; top:8.9vh; height:5.2vh; }
    #panel { position:absolute; right:6.25vw; top:8.9vh; width:39.6vw; height:82.2vh; border-radius:4.4vh;
      overflow:hidden; background:radial-gradient(33.3vw 59.3vh at 50% 46%, #3A2918, #211A13 72%); }
    #panel img { position:absolute; left:50%; top:46%; width:46.3vh; height:46.3vh; transform:translate(-50%,-50%);
      filter:drop-shadow(0 3.7vh 7.4vh rgba(232,120,14,.32)); }
    .screen.split { background:transparent; display:block; text-align:left; }
    .screen.split.hidden { display:none; }
    #idleWords { position:absolute; left:6.25vw; top:27.8vh; height:43.5vh; }
    .lcol { position:absolute; left:6.25vw; top:27.8vh; width:42.7vw; }
    #loadTitle { font-weight:700; font-size:8.5vh; line-height:1.1; letter-spacing:-.2vh; color:var(--fg);
      display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; overflow-wrap:anywhere; }
    #loadTitle:empty { display:none; }
    .bar { position:relative; width:33.3vw; height:.74vh; margin-top:5.2vh; border-radius:.37vh; overflow:hidden;
      background:rgba(244,238,231,.14); }
    .bar i { position:absolute; top:0; bottom:0; width:30%; border-radius:.37vh; background:var(--accent);
      animation:slide 1.6s ease-in-out infinite; }
    @keyframes slide { from { left:-30%; } to { left:100%; } }
    #loadSub { font-size:3vh; color:var(--fg2); margin-top:2.4vh; }

    #chrome { position:absolute; inset:0; z-index:9995; pointer-events:none; }
    #chrome.hidden { display:none; }
    #pill { position:absolute; left:6.25vw; bottom:8.9vh; display:flex; align-items:center; gap:1.4vmin;
      background:var(--surface2); border-radius:999px; padding:1.1vmin 2.2vmin 1.1vmin 1.8vmin; }
    #pillTxt { font-weight:600; font-size:2.4vmin; color:var(--fg2); }
    #pillIcon { width:2.2vmin; height:2.2vmin; flex:0 0 auto; }
    #pillIcon.dot { border-radius:50%; background:var(--success); }
    #pillIcon.spin { border-radius:50%; border:0.42vmin solid var(--line2); border-top-color:var(--fg2);
      animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }


    #error .card { width:62vw; max-width:1000px; background:var(--surface);
      border:2px solid var(--line2); border-radius:2vmin; padding:5vmin 4vmin; }
    #error .bang { font-weight:700; font-size:7vmin; color:var(--danger); line-height:1; }
    #error .msg  { color:var(--fg2); font-size:2.8vmin; margin-top:2vmin; }
    #error .hint { font-family:var(--mono); color:var(--fg3); font-size:2vmin; margin-top:2.6vmin; }

    #dbg { position:absolute; left:1.5vmin; top:1.5vmin; z-index:10000; max-width:70vw; max-height:60vh;
      overflow:hidden; font:2.2vmin/1.35 var(--mono); color:#0f0; white-space:pre-wrap;
      background:rgba(0,0,0,0.55); padding:1vmin 1.5vmin; border-radius:0.8vmin; text-shadow:0 0 2px #000; }
    #dbg.hidden { display:none; }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>

  <div id="chrome" class="hidden">
    <div id="pill"><span id="pillIcon" class="spin"></span><span id="pillTxt">Waiting…</span></div>
  </div>

    var loadWatchdog = null;

    var dbgEl  = document.getElementById('dbg');
    var chrome = document.getElementById('chrome');
    var stage  = document.getElementById('stage');
    var pillIcon = document.getElementById('pillIcon');
    var pillTxt  = document.getElementById('pillTxt');

    function showScreen(name) {
      if (name !== 'loading' && loadWatchdog) { try { clearTimeout(loadWatchdog); } catch (e) {} loadWatchdog = null; }
      ['idle','loading','error'].forEach(function (s) {
        document.getElementById(s).classList.toggle('hidden', s !== name);
      });
      stage.classList.toggle('hidden', name !== 'idle' && name !== 'loading');
      chrome.classList.toggle('hidden', name !== 'idle');
    }

    var lines = [];
    function applyDbg() {
      dbgEl.classList.toggle('hidden', !DEBUG);
      try {
        if (context) context.setLoggerLevel(DEBUG ? cast.framework.LoggerLevel.DEBUG
                                                  : cast.framework.LoggerLevel.ERROR);
      } catch (e) {}
    }
    function dlog(m) {
      try { console.log('[Receiver] ' + m); } catch (e) {}
      if (!DEBUG || !dbgEl) return;
      lines.push(m); while (lines.length > 14) lines.shift();
      dbgEl.textContent = 'build: ' + BUILD + '\n' + lines.join('\n');
    }
    applyDbg();

    window.addEventListener('error', function (ev) {
      DEBUG = true; applyDbg();
      dlog('WINDOW ERROR: ' + (ev.message || '') + ' @' + String(ev.filename || '').slice(-28) + ':' + (ev.lineno || '?'));
    });
    window.addEventListener('unhandledrejection', function (ev) {
      DEBUG = true; applyDbg();
      dlog('PROMISE REJECT: ' + ((ev.reason && ev.reason.message) || ev.reason || '?'));
    });

    showScreen('idle');

    if (typeof cast === 'undefined' || !cast.framework) {
      DEBUG = true; applyDbg();
      if (dbgEl) dbgEl.textContent = 'build: ' + BUILD + '\nFATAL: CAF SDK did not load (script blocked / URL dead)';
      showScreen('error');
      return;
    }

    var context = cast.framework.CastReceiverContext.getInstance();
    var pm = context.getPlayerManager();
    var M = cast.framework.messages, E = cast.framework.events.EventType, SYS = cast.framework.system;
    dlog('context + playerManager ok');
    function toSenders(o) { try { context.sendCustomMessage(NS, undefined, o); } catch (e) {} }
    applyDbg();

    function on(target, type, fn, label) {
      try {
        if (type === undefined || type === null) { dlog('skip ' + label + ' (no such EventType)'); return; }
        target.addEventListener(type, fn);
      } catch (e) { dlog('ERR ' + label + ': ' + (e && e.message || e)); }
    }

    var CAPTION_BG = 'rgba(0,0,0,0.5)';
    var CAPTION_CSS =
      'video::cue{background-color:' + CAPTION_BG + ' !important;color:#fff !important;text-shadow:none !important;}' +
      '.shaka-text-container span{background-color:' + CAPTION_BG + ' !important;color:#fff !important;' +
      'text-shadow:none !important;border-radius:8px;padding:0.1em 0.35em;' +
      '-webkit-box-decoration-break:clone;box-decoration-break:clone;}';
    function appleTextStyle() {
      var s = new M.TextTrackStyle();
      s.foregroundColor = '#FFFFFFFF';
      s.backgroundColor = '#00000080';
      s.edgeType = M.TextTrackEdgeType.NONE;
      s.windowType = M.TextTrackWindowType.NONE;
      s.fontGenericFamily = M.TextTrackFontGenericFamily.SANS_SERIF;
      return s;
    }
    function findVideo(r) {
      try { if (pm.getMediaElement) { var v = pm.getMediaElement(); if (v) { r.videoVia = 'player'; return v; } } } catch (e) {}
      try {
        var cmp = document.querySelector('cast-media-player'), sr = cmp && cmp.shadowRoot;
        if (sr) { var v2 = sr.querySelector('video'); if (v2) { r.videoVia = 'shadow'; return v2; } }
        r.shadowOpen = !!sr;
      } catch (e) {}
      try { var v3 = document.querySelector('video'); if (v3) { r.videoVia = 'document'; return v3; } } catch (e) {}
      r.videoVia = 'none';
      return null;
    }
    function injectCaptionCss(root) {
      var id = 'castCaptionStyle';
      var existing = root.getElementById ? root.getElementById(id) : root.querySelector('#' + id);
      if (existing) return false;
      var el = document.createElement('style');
      el.id = id; el.textContent = CAPTION_CSS;
      (root === document ? document.head : root).appendChild(el);
      return true;
    }
    function cueRulesOf(root) {
      var out = [];
      try {
        var sheets = [].slice.call(root.styleSheets || []);
        if (root.adoptedStyleSheets) sheets = sheets.concat([].slice.call(root.adoptedStyleSheets));
        for (var i = 0; i < sheets.length; i++) {
          var rules;
          try {
            if (sheets[i].ownerNode && sheets[i].ownerNode.id === 'castCaptionStyle') continue;
            rules = sheets[i].cssRules;
          } catch (e) { continue; }
          for (var j = 0; rules && j < rules.length; j++) {
            var t = rules[j].cssText || '';
            if (t.indexOf('cue') >= 0) out.push(t.slice(0, 160));
          }
        }
      } catch (e) {}
      return out;
    }
    var captionsReported = '';
    function styleCaptions(why) {
      var r = { type: 'captions', build: BUILD, why: why };
      try { pm.getTextTracksManager().setTextTrackStyle(appleTextStyle()); r.caf = 'ok'; }
      catch (e) { r.caf = 'threw: ' + (e && e.message || e); }
      try {
        r.cssDocument = injectCaptionCss(document) ? 'added' : 'present';
        var v = findVideo(r);
        if (v) {
          var rn = v.getRootNode ? v.getRootNode() : document;
          r.root = rn === document ? 'document' : 'shadow';
          if (rn !== document) r.cssShadow = injectCaptionCss(rn) ? 'added' : 'present';
          r.shakaContainer = !!((rn.querySelector && rn.querySelector('.shaka-text-container'))
                                || document.querySelector('.shaka-text-container'));
          if (v.textTracks) {
            var showing = 0;
            for (var j = 0; j < v.textTracks.length; j++) if (v.textTracks[j].mode === 'showing') showing++;
            r.textTracks = v.textTracks.length; r.showing = showing;
          }
          if (v.parentNode && v.parentNode.children) {
            var kids = [], ch = v.parentNode.children;
            for (var k = 0; k < ch.length && k < 10; k++)
              kids.push(ch[k].tagName.toLowerCase() + (ch[k].className ? '.' + String(ch[k].className).trim().split(/\s+/).join('.') : ''));
            r.siblings = kids.join(' ');
          }
        }
        var cue = cueRulesOf(document), vr = v && v.getRootNode ? v.getRootNode() : document;
        if (vr !== document) cue = cue.concat(cueRulesOf(vr));
        r.cafCue = cue.slice(0, 4);
      } catch (e) { r.css = 'threw: ' + (e && e.message || e); }
      var key = JSON.stringify(r);
      if (key !== captionsReported) { captionsReported = key; toSenders(r); dlog('captions ' + key.slice(0, 200)); }
    }

    function updatePill() {
      var n = 0; try { n = (context.getSenders() || []).length; } catch (e) {}
      if (n > 0) { pillIcon.className = 'dot'; pillTxt.textContent = 'Connected'; pillTxt.style.color = 'var(--success)'; }
      else       { pillIcon.className = 'spin'; pillTxt.textContent = 'Waiting…';  pillTxt.style.color = 'var(--fg2)'; }
    }
    on(context, SYS.EventType.SENDER_CONNECTED, updatePill, 'SENDER_CONNECTED');
    on(context, SYS.EventType.SENDER_DISCONNECTED, function () { updatePill(); }, 'SENDER_DISCONNECTED');

    pm.setMessageInterceptor(M.MessageType.LOAD, function (req) {
      inError = false;
      showScreen('loading');
      if (loadWatchdog) { try { clearTimeout(loadWatchdog); } catch (e) {} }
      loadWatchdog = setTimeout(function () {
        loadWatchdog = null;
        dlog('LOAD watchdog: 60s on the loading screen with no state change → idle');
        showScreen('idle');
      }, 60000);
      try { if (req.media) req.media.textTrackStyle = appleTextStyle(); } catch (e) {}
      try {
        var m = req.media || {};
        var title = (m.metadata && (m.metadata.title || m.metadata.subtitle)) || '';
        document.getElementById('loadTitle').textContent = title;
        dlog('LOAD ct=' + (m.contentType || '?') + ' url=' + String(m.contentUrl || m.contentId || '').slice(-48));
      } catch (e) {}
      return req;
    });
    try {
      pm.setMessageInterceptor(M.MessageType.EDIT_TRACKS_INFO, function (req) {
        try { req.textTrackStyle = appleTextStyle(); } catch (e) {}
        setTimeout(function () { try { styleCaptions('tracks'); } catch (e) {} }, 700);
        return req;
      });
    } catch (e) { dlog('ERR EDIT_TRACKS_INFO interceptor: ' + (e && e.message || e)); }
    on(pm, E.PLAYER_LOAD_COMPLETE, function () {
      var n = 0; try { n = (((pm.getMediaInformation() || {}).tracks) || []).length; } catch (e) {}
      dlog('LOAD_COMPLETE tracks=' + n);
      try { styleCaptions('load'); } catch (e) {}
      setTimeout(function () { try { styleCaptions('load+5s'); } catch (e) {} }, 5000);
      try {
        if (!shakaReported && readShakaVer()) {
          dlog('shaka now readable v' + shakaVer + ' — re-sending capabilities');
          probeCaps();
        }
      } catch (e) { dlog('ERR shaka re-probe: ' + (e && e.message || e)); }
    }, 'PLAYER_LOAD_COMPLETE');
    on(pm, E.MEDIA_STATUS, function () {
      var st = ''; try { st = pm.getPlayerState(); } catch (e) {}
      if (st === 'PLAYING' || st === 'PAUSED') { inError = false; showScreen('none'); }
      else if (st === 'IDLE') { if (!inError) showScreen('idle'); }
    }, 'MEDIA_STATUS');
    on(pm, E.MEDIA_FINISHED, function () { dlog('MEDIA_FINISHED'); if (!inError) showScreen('idle'); }, 'MEDIA_FINISHED');
    on(pm, E.ERROR, function (e) {
      var code = e.detailedErrorCode;
      dlog('ERROR code=' + code + ' reason=' + (e.error && (e.error.reason || e.error.type) || '?'));
      if (code === 904) return;
      inError = true;
      document.getElementById('errMsg').textContent = 'This media could not be played on this device.';
      try {
        var hintEl = document.getElementById('errHint');
        if (hintEl) hintEl.textContent = 'Cast again from the app to retry.' + (code != null ? ' (code ' + code + ')' : '');
      } catch (e2) {}
      showScreen('error');
      toSenders({ type: 'error', detailedErrorCode: code, reason: e.error && (e.error.reason || e.error.type) });
    }, 'ERROR');

    function probeCaps() {
      var dev = null, dev2 = null;
      try { if (context.getDeviceCapabilities) dev = context.getDeviceCapabilities(); } catch (e) {}
      try { if (context.getDeviceInformation) dev2 = context.getDeviceInformation(); } catch (e) {}
      var DC = (cast.framework.system && cast.framework.system.DeviceCapabilities) || {};
      function devCap(k) { try { return !!(dev && k && dev[k]); } catch (e) { return false; } }
      var hdrOk = devCap(DC.IS_HDR_SUPPORTED) || devCap('is_hdr_supported');
      var dvOk  = devCap(DC.IS_DV_SUPPORTED)  || devCap('is_dv_supported');

      var want = [
        ['H.264 1080p',   'video/mp4',  'avc1.640028',                  1920, 1080, 30, false],
        ['H.264 4K30',    'video/mp4',  'avc1.640033',                  3840, 2160, 30, false],
        ['H.264 4K60',    'video/mp4',  'avc1.640034',                  3840, 2160, 60, false],
        ['HEVC 1080p',    'video/mp4',  'hev1.1.6.L120.B0',             1920, 1080, 30, false],
        ['HEVC 4K60',     'video/mp4',  'hev1.1.6.L153.B0',             3840, 2160, 60, false],
        ['HEVC 4K60 HDR', 'video/mp4',  'hev1.2.4.L153.B0',             3840, 2160, 60, true ],
        ['VP9 4K60',      'video/webm', 'vp09.00.51.08.01.01.01.01.00', 3840, 2160, 60, false],
        ['VP9 4K60 HDR',  'video/webm', 'vp09.02.51.10.01.09.16.09.00', 3840, 2160, 60, true ],
        ['AV1 1080p',     'video/mp4',  'av01.0.05M.08',                1920, 1080, 30, false],
        ['AV1 4K60',      'video/mp4',  'av01.0.13M.08',                3840, 2160, 60, false],
        ['AAC',   'audio/mp4',  'mp4a.40.2'],
        ['AC-3',  'audio/mp4',  'ac-3'],
        ['E-AC-3','audio/mp4',  'ec-3'],
        ['Opus',  'audio/webm', 'opus'],
        ['FLAC',  'audio/mp4',  'flac'],
      ];
      var caps = {};
      for (var i = 0; i < want.length; i++) {
        var a = want[i], ok = false;
        try { ok = context.canDisplayType(a[1], a[2], a[3] || undefined, a[4] || undefined, a[5] || undefined); } catch (e) {}
        if (a[6] && ok) ok = hdrOk;
        caps[a[0]] = ok;
      }

      var mseWant = [
        ['MSE H.264 1080p', 'video/mp4; codecs="avc1.640028"'],
        ['MSE H.264 4K',    'video/mp4; codecs="avc1.640033"'],
        ['MSE HEVC 1080p',  'video/mp4; codecs="hev1.1.6.L93.B0"'],
        ['MSE HEVC 4K',     'video/mp4; codecs="hev1.1.6.L153.B0"'],
        ['MSE VP9 4K',      'video/webm; codecs="vp09.00.51.08"']
      ];
      for (var j = 0; j < mseWant.length; j++) {
        var mok = false;
        try {
          mok = !!(window.MediaSource && window.MediaSource.isTypeSupported
                   && window.MediaSource.isTypeSupported(mseWant[j][1]));
        } catch (e) { mok = false; }
        caps[mseWant[j][0]] = mok;
      }
      dlog('caps H264-4K30=' + caps['H.264 4K30'] + ' H264-4K60=' + caps['H.264 4K60'] + ' HEVC-4K60=' + caps['HEVC 4K60'] +
           ' HEVC-4K60-HDR=' + caps['HEVC 4K60 HDR'] + ' VP9-4K60=' + caps['VP9 4K60'] +
           ' AV1-4K60=' + caps['AV1 4K60'] + ' hdr=' + hdrOk + ' dv=' + dvOk);
      var sv = readShakaVer();
      if (sv) shakaReported = true;
      toSenders({ type: 'capabilities', codecs: caps, hdr: hdrOk, dv: dvOk, device: dev, deviceInfo: dev2,
                  build: BUILD, shakaVersion: sv, shakaProbe: shakaProbe });
    }
    try {
      context.addCustomMessageListener(NS, function (ev) {
        var d = ev.data || {};
        if (d.type === 'getCaps') probeCaps();
        else if (d.type === 'debug') { DEBUG = !!d.on; applyDbg(); }
      });
    } catch (e) { dlog('ERR addCustomMessageListener: ' + (e && e.message || e)); }

    var options = new cast.framework.CastReceiverOptions();
    if (SHAKA === 'pinned') {
      options.useShakaForHls = true;
      options.shakaVersion = '4.15.56';
    }
    options.customNamespaces = {}; options.customNamespaces[NS] = SYS.MessageType.JSON;
    on(context, SYS.EventType.READY, function () {
      var rv = readShakaVer();
      showScreen('idle'); updatePill();
      dlog('READY ok (shaka=' + SHAKA + (rv ? ' v' + rv : ' v? ' + shakaProbe) + ')'); probeCaps();
    }, 'READY');
    dlog('calling context.start (shaka=' + SHAKA + ')…');
    try { context.start(options); dlog('context.start returned'); }
    catch (e) { DEBUG = true; applyDbg(); dlog('ERR context.start: ' + (e && e.message || e)); showScreen('error'); }
  })();
  </script>
</body>
</html>
